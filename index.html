<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>29 Sides of Him | Turning 29 Countdown</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0b0f19;
            --bg-card: #131b2e;
            --bg-card-hover: #1a243f;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa8c2c;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-pink: #f472b6;
            --border-color: rgba(212, 175, 55, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
            background: linear-gradient(180deg, rgba(19,27,46,0.8) 0%, rgba(11,15,25,0) 100%);
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(244, 114, 182, 0.1);
            border: 1px solid rgba(244, 114, 182, 0.3);
            color: var(--accent-pink);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 4vw, 3.5rem);
            color: var(--gold-light);
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto 20px;
        }

        .countdown-banner {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            margin-bottom: 10px;
        }

        .countdown-banner span {
            color: var(--gold-primary);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 180px;
        }

        .card:hover:not(.locked) {
            transform: translateY(-5px);
            border-color: var(--gold-primary);
            background-color: var(--bg-card-hover);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
        }

        .card.locked {
            opacity: 0.6;
            cursor: not-allowed;
            background-color: #0f1420;
        }

        .card.grand-finale {
            border: 2px solid var(--gold-primary);
            background: linear-gradient(135deg, #131b2e 0%, #221c0b 100%);
        }

        .day-number {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--gold-primary);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .card-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 12, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--gold-primary);
            width: 100%;
            max-width: 650px;
            border-radius: 24px;
            padding: 32px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: var(--gold-primary);
            color: var(--bg-deep);
        }

        .modal-day {
            color: var(--gold-primary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 20px;
            color: var(--gold-light);
        }

        .photo-frame {
            width: 100%;
            height: 280px;
            background: #1e293b;
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .section-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .section-box h4 {
            color: var(--gold-primary);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .joke-text {
            font-style: italic;
            font-size: 1.05rem;
            color: #e2e8f0;
            line-height: 1.5;
        }

        /* Cute Chatbot Floating Widget */
        #chat-widget-container {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 1000;
        }

        #chat-toggle-btn {
            background: linear-gradient(135deg, #f472b6 0%, #d4af
